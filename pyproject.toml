[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dasmos"
dynamic = ["version"]
authors = [
    { name = "Robert Smallshire", email = "rob@sixty-north.com" },
]
description = "Extensible tracing disassembler for classic CPUs, with CPU, renderer and environment extension points."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyoulikeit>=1.1",
    "click>=8.0",
    # Markdown parser used by ``dasmos.core.markdown_asm`` to render
    # comment / subroutine-description text down to plaintext for asm
    # output. The structured JSON renderer keeps the source markdown
    # verbatim; only the asm-side renderers strip it.
    "mistletoe>=1.4",
    "stevedore",
]

[project.scripts]
dasmos = "dasmos.cli:cli"

[project.urls]
Homepage = "https://github.com/acornaeology/dasmos"
Repository = "https://github.com/acornaeology/dasmos"
Issues = "https://github.com/acornaeology/dasmos/issues"

# Extension points. CPU, renderer and environment plug-ins are
# registered under these namespaces; built-in entries follow the
# ext/<plural>/<name>:<UniformSymbol> alias convention. No built-ins
# ship in the initial scaffold — entries get added here as concrete
# CPUs (NMOS 6502, CMOS 65C02, MC6809, …), renderers (Beebasm, JSON,
# ca65, …) and environments (acorn-bbc-model-b, acorn-mos-1_20, …)
# land.
[project.entry-points."dasmos.cpu"]
# Entry-point keys carry the canonical chip name. TOML bare keys
# allow digits-leading and uppercase ([A-Za-z0-9_-]), so "6502" and
# "65C02" are valid keys. The CPU lookup is case-insensitive
# (``--cpu 65c02`` resolves to ``65C02``), but the registered name
# is the form shown by ``dasmos list-cpus`` and used in JSON output.
6502 = "dasmos.ext.cpus.cpu6502:Cpu"
65C02 = "dasmos.ext.cpus.cpu65c02:Cpu"

[project.entry-points."dasmos.renderer"]
beebasm = "dasmos.ext.renderers.beebasm:Renderer"
json = "dasmos.ext.renderers.json:Renderer"

[project.entry-points."dasmos.environment"]
acorn_mos = "dasmos.ext.environments.acorn_mos:Environment"
acorn_sideways_rom = "dasmos.ext.environments.acorn_sideways_rom:Environment"
acorn_model_b_hardware = "dasmos.ext.environments.acorn_model_b_hardware:Environment"
acorn_master_hardware = "dasmos.ext.environments.acorn_master_hardware:Environment"
acorn_fdc_8271 = "dasmos.ext.environments.acorn_fdc_8271:Environment"
acorn_fdc_1770 = "dasmos.ext.environments.acorn_fdc_1770:Environment"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "dasmos.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dasmos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
test = [
    "pytest>=8",
]
docs = [
    "sphinx>=8",
    "sphinx-rtd-theme>=2",
    "sphinx-copybutton>=0.5",
]
dev = [
    "bump-my-version>=0.28",
    "jinja2>=3.1",
    "pre-commit>=3",
    { include-group = "test" },
]

[tool.bumpversion]
current_version = "1.4.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
tag = true
commit = true
message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
files = [
    { filename = "src/dasmos/__init__.py" },
]

# After bump-my-version updates __init__.py but before it commits,
# regenerate the README (its template embeds {{ version }}) and stage
# it. Without this, every bump creates a commit + tag with a stale
# README, which the readme-check gate in release.yml refuses to
# publish.
pre_commit_hooks = [
    "uv run python scripts/generate_readme.py",
    "git add README.md",
]
