repos:
  - repo: local
    hooks:
      - id: generate-readme-update
        name: Regenerate README.md
        entry: bash -c 'uv run python scripts/generate_readme.py && git add README.md'
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            README\.md
            | scripts/generate_readme\.py
            | scripts/readme_template\.md\.j2
            | src/dasmos/.*\.py
            | pyproject\.toml
          )$
