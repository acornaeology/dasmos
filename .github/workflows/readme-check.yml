name: README check

# Reusable workflow: verifies that README.md is in sync with the
# generator (scripts/generate_readme.py). Called by ci.yml on push/PR
# and by release.yml as a publication gate so a v-tag with a stale
# README is held back from PyPI.

on:
  workflow_call:

jobs:
  check:
    name: README.md is in sync with the generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          cache-dependency-glob: pyproject.toml

      - name: Install dev dependencies
        run: uv sync

      - name: Verify README.md matches the generator's output
        run: uv run python scripts/generate_readme.py --check
